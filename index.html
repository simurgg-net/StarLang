<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiger English</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3d5af1"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#1b2140;--mu:#6b7194;--pr:#3d5af1;--pl:#dfe5ff;--or:#ff9f43;--pk:#ff6b6b;--gr:#2fbf71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12162b;--card:#1d2342;--tx:#eef0ff;--mu:#9aa1cc;--pl:#2a3366}}
:root[data-theme=dark]{--bg:#12162b;--card:#1d2342;--tx:#eef0ff;--mu:#9aa1cc;--pl:#2a3366}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 "Nunito","Trebuchet MS",system-ui,sans-serif;max-width:480px;margin:auto;padding:16px 16px 90px}
h1{font-size:26px;margin:4px 0 12px}h2{font-size:18px;margin:18px 0 8px}p{margin:4px 0}
.c{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px}
.pv{background:var(--pr);color:#fff}.pv small{opacity:.8}.pv b{font-size:20px;display:block;margin:6px 0}
.hero{display:flex;gap:12px;align-items:center;background:var(--pl)}.hero svg{width:92px;flex:none}
.btn{border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:800;background:var(--pr);color:#fff;width:100%;cursor:pointer}
.btn:disabled{background:var(--gr)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-weight:800;background:var(--card);color:var(--mu)}.tabs .on{background:var(--or);color:#fff}
.w{display:flex;justify-content:space-between;gap:8px;border-left:6px solid var(--or)}.w.d{border-color:var(--pk)}.w i{color:var(--mu)}.w p{color:var(--mu);font-size:14px}
.b{display:flex;flex-direction:column;gap:6px}.b button{width:40px;height:40px;border:0;border-radius:50%;background:var(--pl);font-size:18px;cursor:pointer}.b .rec{background:var(--pk)}
.g{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}.g span{aspect-ratio:1;border-radius:6px;background:var(--pl)}
.l1{background:#ffd59e!important}.l2{background:#ffb15c!important}.l3{background:var(--or)!important;}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars u{display:block;background:var(--pr);border-radius:8px 8px 4px 4px;min-height:4px}
.st{display:flex;gap:10px}.st .c{flex:1;text-align:center;margin:0 0 14px}.st b{font-size:26px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:24px 24px 0 0}
nav button{flex:1;border:0;border-radius:16px;padding:10px;font:inherit;font-weight:800;background:none;color:var(--mu)}nav .on{background:var(--pl);color:var(--pr)}
button:focus-visible{outline:3px solid var(--pr)}
.sc{text-align:center;padding:28px 20px;touch-action:pan-y;user-select:none;cursor:grab;min-height:310px;border-bottom:8px solid var(--or)}.sc b{font-size:36px;display:block;margin:6px 0}.sc i{font-size:20px;color:var(--mu);display:block}.sc p{font-size:18px;margin:14px 0}.sc .b{flex-direction:row;justify-content:center}.sc .b button{width:48px;height:48px}
.sw2{display:flex;gap:12px;margin-bottom:10px}.sw2 button{flex:1;border:0;border-radius:18px;padding:14px;font:inherit;font-weight:800}.no{background:var(--pk);color:#fff}.ok{background:var(--gr);color:#fff}
#rb{display:none;position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:456px;margin:auto;align-items:center;gap:10px;background:var(--card);border-radius:28px;padding:8px 8px 8px 16px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#rb .dot{width:12px;height:12px;border-radius:50%;background:var(--pk);animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}
#rb .wv{flex:1;display:flex;align-items:center;gap:3px;height:36px;overflow:hidden}#rb .wv i{flex:1;background:var(--pr);border-radius:3px;height:4px}
#rb button{width:42px;height:42px;border:0;border-radius:50%;background:var(--pl);font-size:18px}#rb .go{background:var(--gr);color:#fff}
#er{display:none;position:fixed;left:12px;right:12px;top:12px;max-width:456px;margin:auto;background:var(--pk);color:#fff;border-radius:16px;padding:12px 16px;font-weight:700;z-index:9}
</style></head><body><div id="app"></div>
<div id="er"></div><div id="rb"><span class="dot"></span><b id="tm">0:00</b><div class="wv"></div><button onclick="cancelRec()" aria-label="İptal">🗑</button><button class="go" onclick="rc&&rc.stop()" aria-label="Kaydet">✔</button></div>
<nav><button data-t="h">🏠 Ana</button><button data-t="w">📚 Kelime</button><button data-t="s">📊 Seri</button></nav>
<script>
const D=[["variable","değişken","A variable stores a value in a program."],["function","fonksiyon","This function adds two numbers."],["database","veritabanı","We keep all user data in a database."],["server","sunucu","The server is down right now."],["bug","hata","I found a bug in my code."],["update","güncelleme","Please install the latest update."],["password","parola","Never share your password with anyone."],["network","ağ","The network is very slow today."],["download","indirmek","I will download the file tonight."],["file","dosya","Can you send me the file?"],
["schedule","program","My schedule is busy this week."],["improve","geliştirmek","I want to improve my English."],["borrow","ödünç almak","Can I borrow your pen?"],["expensive","pahalı","This phone is too expensive for me."],["neighbor","komşu","My neighbor is very kind."],["journey","yolculuk","The journey to Istanbul takes five hours."],["decide","karar vermek","I can't decide what to eat."],["familiar","tanıdık","Your face looks familiar."],["appointment","randevu","I have a doctor's appointment at ten."],["reply","cevap vermek","Please reply to my message soon."]];
const P=[["Actions speak louder than words.","Lafla peynir gemisi yürümez."],["A friend in need is a friend indeed.","Dost kara günde belli olur."],["Rome wasn't built in a day.","Roma bir günde kurulmadı."],["Two heads are better than one.","Akıl akıldan üstündür."],["All that glitters is not gold.","Parlayan her şey altın değildir."],["The pen is mightier than the sword.","Kalem kılıçtan keskindir."],["Don't put all your eggs in one basket.","Bütün yumurtaları aynı sepete koyma."],["When in Rome, do as the Romans do.","Roma'da Romalı gibi davran."],["Where there's a will, there's a way.","İsteyenin bir yolu, istemeyenin bahanesi vardır."],["Practice makes perfect.","Pratik mükemmelleştirir."],["Better late than never.","Geç olsun, güç olmasın."],["Don't judge a book by its cover.","Kitabı kapağına göre yargılama."],["The early bird catches the worm.","Erken kalkan yol alır."],["Every cloud has a silver lining.","Her kötülüğün bir iyiliği vardır."],["A journey of a thousand miles begins with a single step.","Bin millik yolculuk tek adımla başlar."]];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),K=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let S={done:{},sec:{}};try{S=JSON.parse(localStorage.getItem("te"))||S}catch(e){}
const save=()=>{try{localStorage.setItem("te",JSON.stringify(S))}catch(e){}};
let tab="h",kind=0,R={},today=K(new Date()),rc=null;
const day=Object.keys(S.done).length,DI=day%P.length;
function streak(){let n=0,d=new Date();if(!S.done[K(d)])d.setDate(d.getDate()-1);while(S.done[K(d)]){n++;d.setDate(d.getDate()-1)}return n}
const tiger=m=>`<svg viewBox="0 0 100 100"><circle cx="20" cy="26" r="14" fill="#ff9f43"/><circle cx="20" cy="26" r="7" fill="#ffc9d6"/><circle cx="80" cy="26" r="14" fill="#ff9f43"/><circle cx="80" cy="26" r="7" fill="#ffc9d6"/><ellipse cx="50" cy="56" rx="42" ry="38" fill="#ff9f43"/><path d="M50 19v13M37 21l3 10M63 21l-3 10M9 52h11M10 62l10-2M91 52H80M90 62l-10-2" stroke="#3a2417" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="50" cy="70" rx="19" ry="14" fill="#fff4e0"/><ellipse cx="33" cy="52" rx="9" ry="10.5" fill="#3a2417"/><ellipse cx="67" cy="52" rx="9" ry="10.5" fill="#3a2417"/><circle cx="36" cy="48" r="3.6" fill="#fff"/><circle cx="70" cy="48" r="3.6" fill="#fff"/><circle cx="31" cy="56" r="1.6" fill="#fff"/><circle cx="65" cy="56" r="1.6" fill="#fff"/><ellipse cx="20" cy="66" rx="7" ry="4.5" fill="#ff6b6b" opacity=".45"/><ellipse cx="80" cy="66" rx="7" ry="4.5" fill="#ff6b6b" opacity=".45"/><path d="M45 62h10l-5 5z" fill="#e8607a"/><path d="${m?"M40 71q5 7 10 1q5 6 10-1":"M43 74q7 4 14 0"}" stroke="#3a2417" stroke-width="2.8" fill="none" stroke-linecap="round"/></svg>`;
let ci=0,again=0;
function bindSw(){const e=$("#sw");if(!e)return;let x0=null,dx=0;e.onpointerdown=ev=>{if(ev.target.closest("button"))return;x0=ev.clientX;e.setPointerCapture(ev.pointerId)};e.onpointermove=ev=>{if(x0===null)return;dx=ev.clientX-x0;e.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;e.style.opacity=1-Math.abs(dx)/500};e.onpointerup=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>90)next(dx>0);else{e.style.transform="";e.style.opacity=1}dx=0}}
function next(ok){const e=$("#sw");e.style.transition="transform .25s,opacity .25s";e.style.transform=`translateX(${ok?400:-400}px) rotate(${ok?20:-20}deg)`;e.style.opacity=0;setTimeout(()=>{if(!ok)again++;ci++;draw()},220)}
function say(i,slow){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(D[i][2]);u.lang="en-US";u.rate=slow?.55:.9;speechSynthesis.speak(u)}
let actx,raf,tmr;
function err(m){const e=$("#er");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",6000)}
function cancelRec(){if(rc){rc.cancel=1;rc.stop()}}
async function rec(i){if(rc){rc.stop();return}
if(!navigator.mediaDevices||!window.MediaRecorder){err("Bu ortam ses kaydını desteklemiyor.");return}
try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rc=new MediaRecorder(st);rc.ondataavailable=e=>ch.push(e.data);
actx=new AudioContext();const an=actx.createAnalyser();an.fftSize=64;actx.createMediaStreamSource(st).connect(an);
const wv=$("#rb .wv");wv.innerHTML="<i></i>".repeat(24);const bs=wv.children,f=new Uint8Array(an.frequencyBinCount);
const tick=()=>{an.getByteFrequencyData(f);for(let k=0;k<24;k++)bs[k].style.height=Math.max(4,f[k]/255*34)+"px";raf=requestAnimationFrame(tick)};
rc.onstop=()=>{cancelAnimationFrame(raf);clearInterval(tmr);actx.close();st.getTracks().forEach(t=>t.stop());$("#rb").style.display="none";if(!rc.cancel)R[i]=URL.createObjectURL(new Blob(ch));rc=null;draw()};
const t0=Date.now();rc.start();$("#rb").style.display="flex";$("#tm").textContent="0:00";tmr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("#tm").textContent=Math.floor(s/60)+":"+pad(s%60)},500);tick();draw(i)}
catch(e){rc=null;err(e.name=="NotAllowedError"?"Mikrofon izni verilmedi. Bu önizleme mikrofonu engelliyor olabilir; Android uygulamasında çalışacak.":"Mikrofon açılamadı: "+e.name)}}
const play=i=>new Audio(R[i]).play();
function finish(){S.done[today]=1;save();draw()}
function draw(recIdx){const a=$("#app");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));const sk=streak();
if(tab=="h"){const p=P[DI];a.innerHTML=`<h1>Merhaba Emir!</h1><div class="c pv"><small>Günün atasözü</small><b>${p[0]}</b><span>${p[1]}</span></div><div class="c hero">${tiger(sk>0)}<div><b>${sk} günlük seri</b><p>${sk?"Harika gidiyorsun, bugün de devam!":"Bugün ilk adımı at, seri başlasın."}</p></div></div><button class="btn" ${S.done[today]?"disabled":""} onclick="${S.done[today]?"":"tab='w';draw()"}">${S.done[today]?"Bugün tamamlandı ✓":"Bugünkü 20 kelimeye başla"}</button>`}
else if(tab=="w"){if(ci>=D.length){a.innerHTML=`<h1>Harika! 🎉</h1><div class="c hero">${tiger(1)}<div><b>${D.length} kelimeyi bitirdin</b><p>Tekrar edilecek: ${again} kelime</p></div></div><button class="btn" ${S.done[today]?"disabled":""} onclick="finish()">${S.done[today]?"Bugün tamamlandı ✓":"Günü tamamla"}</button><button class="btn" style="margin-top:8px;background:var(--pl);color:var(--pr)" onclick="ci=0;again=0;draw()">Baştan başla</button>`}
else{const i=ci,w=D[i];a.innerHTML=`<h1>${i+1} / ${D.length}</h1><div id="sw" class="c sc"><b>${w[0]}</b><i>${w[1]}</i><p>${w[2]}</p><div class="b"><button onclick="say(${i},0)" aria-label="Dinle">🔊</button><button onclick="say(${i},1)" aria-label="Yavaş dinle">🐢</button><button class="${recIdx===i?"rec":""}" onclick="rec(${i})" aria-label="Kaydet">${recIdx===i?"⏹":"🎙️"}</button>${R[i]?`<button onclick="play(${i})" aria-label="Kaydımı dinle">▶</button>`:""}</div></div><div class="sw2"><button class="no" onclick="next(0)">✗ Tekrar</button><button class="ok" onclick="next(1)">✓ Biliyorum</button></div><p style="text-align:center;color:var(--mu);font-size:14px">Kartı sağa kaydır: biliyorum, sola: tekrar</p>`;bindSw()}}
else{const m=Math.round((S.sec[today]||0)/60);let g="";for(let i=97;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=K(d),x=(S.sec[k]||0)/60;g+=`<span title="${k}" class="${S.done[k]?(x>20?"l3":x>8?"l2":"l1"):""}"></span>`}
let bars="",mx=1,arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push([["Pz","Pt","Sa","Ça","Pe","Cu","Ct"][d.getDay()],(S.sec[K(d)]||0)/60])}arr.forEach(x=>mx=Math.max(mx,x[1]));bars=arr.map(x=>`<div><u style="height:${x[1]/mx*80}px"></u>${x[0]}<br>${Math.round(x[1])}dk</div>`).join("");
a.innerHTML=`<h1>Serin</h1><div class="st"><div class="c"><b>🔥 ${sk}</b>gün seri</div><div class="c"><b>${Object.keys(S.done).length}</b>tamamlanan gün</div><div class="c"><b>${m}</b>bugün dk</div></div><div class="c"><h2 style="margin-top:0">Son 14 hafta</h2><div class="g">${g}</div></div><div class="c"><h2 style="margin-top:0">Haftalık çalışma süresi</h2><div class="bars">${bars}</div></div>`}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
setInterval(()=>{if(!document.hidden){S.sec[today]=(S.sec[today]||0)+5;save()}},5000);draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
